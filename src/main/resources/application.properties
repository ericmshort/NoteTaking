spring.application.name=notetaking-service
server.port=8080

# Trust X-Forwarded-Proto from reverse proxies (required for HTTPS enforcement)
server.forward-headers-strategy=framework

# H2 file-based database (persists between restarts in ./data/notetaking.mv.db)
# To switch to PostgreSQL: change driver, url, and swap the h2 dependency for postgresql
# WARNING: AUTO_SERVER=TRUE opens a random TCP port for multi-process access — dev only.
# Remove AUTO_SERVER=TRUE (or disable H2 entirely) for production deployments.
spring.datasource.url=jdbc:h2:file:./data/notetaking;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 console - access requires ADMIN role
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT access token - 15 minutes; refresh token extends sessions without re-login
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

# Refresh tokens - 7-day lifetime, rotated on each use
app.refresh-token.expiry-days=7

# CORS - comma-separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# HTTPS enforcement - set to true when running behind a TLS-terminating proxy
app.https.enforce=${HTTPS_ENFORCE:false}

# Redis - set host to activate RedisTokenRevocationStore (persistent across restarts)
# spring.data.redis.host=localhost
# spring.data.redis.port=6379

# Admin bootstrap - creates the first admin user on startup if ADMIN_USERNAME is set
# ADMIN_USERNAME=admin
# ADMIN_PASSWORD=<strong-password>

# Account lockout - lock after N failed login attempts for M minutes
app.security.max-failed-attempts=10
app.security.lockout-minutes=15

# Actuator - health and info are public; all other actuator endpoints require ADMIN role
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true
info.app.name=NoteTaking Service
info.app.version=1.0.0-SNAPSHOT

# Logging - set spring.profiles.active=prod to switch to structured JSON output
logging.level.com.notetaking=INFO
logging.level.org.springframework.security=WARN

# Spring i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
