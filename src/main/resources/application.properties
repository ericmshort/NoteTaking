spring.application.name=notetaking-service
server.port=8080

# H2 file-based database (persists between restarts in ./data/notetaking.mv.db)
# To switch to PostgreSQL: change driver, url, and swap the h2 dependency for postgresql
spring.datasource.url=jdbc:h2:file:./data/notetaking;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 console (remove or disable for production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT - CHANGE THIS SECRET BEFORE DEPLOYING
# Generate with: openssl rand -base64 64
app.jwt.secret=bm90ZXRha2luZ3NlY3JldGtleW11c3RiZWF0bGVhc3QyNTZiaXRzbG9uZ2ZvckhNQUNTSEEyNTY=
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.notetaking=INFO
logging.level.org.springframework.security=WARN

# Spring i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
